spring:
  application:
    name: vitacare-api
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/vitacare_db}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8080}

jwt:
  secreto: ${JWT_SECRET}

cors:
  origenes-permitidos: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
