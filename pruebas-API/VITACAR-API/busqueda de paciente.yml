info:
  name: busqueda de paciente
  type: http
  seq: 13

http:
  method: GET
  url: http://localhost:8080/api/pacientes?search=Juan&page=0&size=10
  params:
    - name: search
      value: Juan
      type: query
    - name: page
      value: "0"
      type: query
    - name: size
      value: "10"
      type: query
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
