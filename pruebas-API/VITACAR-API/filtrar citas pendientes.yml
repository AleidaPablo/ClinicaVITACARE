info:
  name: filtrar citas pendientes
  type: http
  seq: 24

http:
  method: GET
  url: http://localhost:8080/api/citas?estado=PENDIENTE&page=0&size=10
  params:
    - name: estado
      value: PENDIENTE
      type: query
    - name: page
      value: "0"
      type: query
    - name: size
      value: "10"
      type: query
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
